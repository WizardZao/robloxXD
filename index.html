<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Imagem 3D</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 1, 1).normalize();
    scene.add(light);

    // Textura da imagem
    const loader = new THREE.TextureLoader();
    loader.load("noFilter.png", function (texture) {
      const geometry = new THREE.PlaneGeometry(6, 4, 40, 40);

      // Adiciona curvatura (efeito 3D real)
      const position = geometry.attributes.position;
      for (let i = 0; i < position.count; i++) {
        const y = position.getY(i);
        const curve = Math.sin((y / 4) * Math.PI) * 0.3;
        position.setZ(i, curve);
      }

      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.7,
        metalness: 0.1,
      });

      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      camera.position.z = 7;

      // Mouse move
      document.addEventListener("mousemove", (event) => {
        const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
        const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;

        mesh.rotation.y = mouseX * 0.5;
        mesh.rotation.x = mouseY * 0.3;
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      animate();
    });
  </script>
</body>
</html>
